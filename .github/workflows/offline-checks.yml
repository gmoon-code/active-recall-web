name: Active Recall Web free offline checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check human-review.js
          node --check paired-review.js
          node --check paired-review-ui.js
          node --check review-packets.js
          node --check review-packets-ui.js
          node --check reference-first.js
          node --check reference-first-ui.js
          node --check reviewer-pilot.js
          node --check reviewer-pilot-ui.js
          node --check reviewer-training.js
          node --check reviewer-training-ui.js
          node --check reviewer-usability.js
          node --check reviewer-usability-ui.js
          node --check core.js
          node --check qa-import.js
          node --check app.js
          node --check study-rhythm.js
          node --check storage.js
          node --check intelligence.js
          node --check document-import.js
      - name: Local deterministic tests
        run: node --test test-human-review.cjs test-paired-review.cjs test-review-packets.cjs test-reference-first.cjs test-reviewer-pilot.cjs test-reviewer-training.cjs test-reviewer-usability.cjs test-question-quality.cjs test-manual-qa.cjs test-qa-import.cjs test-qa-delete.cjs test-qa-purge.cjs test-deploy-preflight.cjs test-study-rhythm.cjs test-study-rhythm-app.cjs test-priority-inspector.cjs test-memory-readiness.cjs test-prospective-forecast.cjs test-prospective-evidence.cjs test-due-catchup.cjs test-unrated-skip.cjs test-question-correction-hold.cjs test-correction-reasons.cjs test-source-repair-context.cjs
      - name: Free Chromium desktop and mobile smoke
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node test-browser-smoke.cjs
          node test-paired-browser.cjs
          node test-offline-review-browser.cjs
          node test-reference-first-browser.cjs
          node test-reviewer-pilot-browser.cjs
          node test-reviewer-training-browser.cjs
          node test-reviewer-usability-browser.cjs
          node test-question-quality-browser.cjs
          node test-manual-qa-browser.cjs
          node test-qa-import-browser.cjs
          node test-qa-delete-browser.cjs
          node test-study-rhythm-browser.cjs
          node test-schedule-simulator-browser.cjs
          node test-priority-inspector-browser.cjs
          node test-memory-readiness-browser.cjs
          node test-prospective-forecast-browser.cjs
          node test-prospective-evidence-browser.cjs
          node test-due-catchup-browser.cjs
          node test-unrated-skip-browser.cjs
          node test-question-correction-hold-browser.cjs
          node test-correction-reasons-browser.cjs
          node test-source-repair-context-browser.cjs
